spring:
  application:
    name: cineai-backend

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:cineai}
    username: ${POSTGRES_USER:cineai}
    password: ${POSTGRES_PASSWORD:cineai_pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info